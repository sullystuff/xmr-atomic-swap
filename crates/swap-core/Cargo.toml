[package]
name = "swap-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "XMR atomic swaps: every cryptographic rule, encoding and the reference state machine (native + wasm32)"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gen-vectors"
path = "src/bin/gen-vectors.rs"

[[bin]]
name = "xmr-joint-sweep"
path = "src/bin/xmr-joint-sweep.rs"

[dependencies]
sigma_fun = { version = "=0.9.0", default-features = false, features = ["alloc", "secp256k1", "ed25519", "serde", "bincode"] }
curve25519-dalek-ng = "4"            # 4.1.1, the ed25519 types sigma_fun uses
bincode = { version = "2", features = ["serde"] }     # 2.0.1
monero-wallet = "=0.2.0"             # monero-oxide
monero-daemon-rpc = "=0.2.0"
curve25519-dalek = { version = "4", default-features = false }   # 4.1.3
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"            # XChaCha20-Poly1305
scrypt = { version = "0.11", default-features = false }
# Not in SPEC 1.3 (see docs/research/wp1-deviations.md, C1): RFC 8032 signatures for envelopes,
# session keys and advance approvals; HMAC for RFC 6979 nonces in the EIP-712 test vectors.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }
hmac = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
monero-simple-request-rpc = "=0.1.0"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }
