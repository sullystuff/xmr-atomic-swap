[package]
name = "xmr-joint-sweep"
version = "0.0.0"
edition = "2021"
publish = false
description = "Prototype: sweep a 2-of-2 joint Monero address with monero-oxide's monero-wallet, natively and in the browser (wasm32)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monero-wallet = "0.2.0"
monero-daemon-rpc = "0.2.0"
curve25519-dalek = { version = "4", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
monero-simple-request-rpc = "0.1.0"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "RequestMode", "Response", "Headers", "Window", "WorkerGlobalScope"] }
send_wrapper = { version = "0.6", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
