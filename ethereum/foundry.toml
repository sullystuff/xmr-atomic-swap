[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
# So that `forge inspect <contract> storage-layout` works without a rebuild (STORAGE.md).
extra_output = ["storageLayout"]
# One test asks `cast wallet sign` to sign the typed-data JSON of eip712.json (SPEC 9.1).
ffi = true
# Tests read the frozen vectors of work package 1; the contract imports the frozen interface.
fs_permissions = [
  { access = "read", path = "../interfaces/vectors" },
  # The anvil-only deploy script writes the addresses it deployed.
  { access = "read-write", path = "./deployments" },
]
allow_paths = ["../interfaces"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
  "xmrswap-interfaces/=../interfaces/",
]
gas_limit = "18446744073709551615"
memory_limit = 1073741824

[fuzz]
runs = 256

[invariant]
runs = 40
depth = 160
fail_on_revert = false

[lint]
lint_on_build = false
