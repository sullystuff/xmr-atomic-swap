[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
# Tests read the frozen vectors of work package 1; the contract imports the frozen interface.
fs_permissions = [{ access = "read", path = "../interfaces/vectors" }]
allow_paths = ["../interfaces"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
  "xmrswap-interfaces/=../interfaces/",
]
gas_limit = "18446744073709551615"
memory_limit = 1073741824

[fuzz]
runs = 256

[invariant]
runs = 48
depth = 96
fail_on_revert = false

[lint]
lint_on_build = false
