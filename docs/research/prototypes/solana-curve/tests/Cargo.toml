[package]
name = "curve-check-tests"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.94"

[dev-dependencies]
litesvm = "=0.16.0"
litesvm-token = "=0.16.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"
solana-instruction = "3"
solana-pubkey = { version = "4", features = ["curve25519"] }
solana-clock = "3"
solana-rent = "4"
solana-system-interface = { version = "3", features = ["bincode"] }
sha2 = "0.10"
curve25519-dalek = "4"
base64 = "0.22"
rand = "0.8"

[workspace]
