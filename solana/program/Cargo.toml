[package]
name = "xmr-swap"
version = "0.1.0"
edition = "2021"
rust-version = "1.84" # = platform-tools v1.51 rustc; drives MSRV-aware resolution
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "xmr_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# declared only to silence anchor's `unexpected cfg` warnings
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "associated_token", "token_2022"] }
solana-curve25519 = "=2.3.13"
solana-msg = "2"
# The pure rules of the escrow machine, shared with the reference model (SPEC 11.4).
escrow-logic = { path = "../../crates/escrow-logic" }
solana-sha256-hasher = "2.3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace]
